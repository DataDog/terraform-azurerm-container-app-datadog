name: E2E Test

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '*.tf'
      - 'e2e/**'
      - '.github/workflows/e2e.yaml'
  push:
    branches: [main]
    paths:
      - '*.tf'
      - 'e2e/**'
      - '.github/workflows/e2e.yaml'

jobs:
  e2e:
    name: Container App E2E
    if: >-
      github.repository == 'DataDog/terraform-azurerm-container-app-datadog' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # required for Azure OIDC federation
    env:
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false # Terratest parses raw terraform output

      - name: Azure login (OIDC)
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_E2E }}
          tenant-id: ${{ vars.AZURE_TENANT_ID_E2E }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_E2E }}

      - name: Get Datadog credentials (dd-sts)
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: terraform-azurerm-container-app-datadog-e2e

      - name: Set run ID
        run: echo "E2E_RUN_ID=$(openssl rand -hex 4)" >> "$GITHUB_ENV"

      - name: Run e2e tests
        working-directory: e2e
        run: |
          set -o pipefail
          go test -count=1 -v -parallel 7 -timeout 20m -json ./... | jq --unbuffered -jr 'select(.Action == "output") | .Output'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_E2E }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_E2E }}
          AZURE_CONTAINER_APP_ENV: ${{ vars.AZURE_CONTAINER_APP_ENV_E2E }}
          DD_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          DD_APP_KEY: ${{ steps.dd-sts.outputs.app_key }}
          DD_SITE: ${{ vars.DD_SITE_E2E || 'datadoghq.com' }}

      - name: Ensure app deletion
        if: always() && env.E2E_RUN_ID != ''
        run: |
          names="$(az resource list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.App/containerApps \
            --query "[?starts_with(tags.one_e2e_run_id, '$E2E_RUN_ID-')].name" \
            --output tsv \
            --only-show-errors)"
          while IFS= read -r name; do
            if [[ -n "$name" ]]; then
              az containerapp delete --resource-group "$AZURE_RESOURCE_GROUP" --name "$name" --yes --no-wait --only-show-errors
            fi
          done <<< "$names"
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_E2E }}
