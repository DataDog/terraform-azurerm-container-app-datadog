name: E2E Test

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '*.tf'
      - 'e2e/**'
      - '.github/workflows/e2e.yaml'
  push:
    branches: [main]
    paths:
      - '*.tf'
      - 'e2e/**'
      - '.github/workflows/e2e.yaml'

jobs:
  e2e:
    name: Container App E2E
    if: >-
      github.repository == 'DataDog/terraform-azurerm-container-app-datadog' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      id-token: write # required for Azure OIDC federation
    env:
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: yes_without_prompt
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false # Terratest parses raw terraform output

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_E2E }}
          tenant-id: ${{ vars.AZURE_TENANT_ID_E2E }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID_E2E }}

      - name: Get Datadog credentials (dd-sts)
        id: dd-sts
        uses: DataDog/dd-sts-action@2e8187910199bd93129520183c093e19aa585c75 # v1.0.0
        with:
          policy: terraform-azurerm-container-app-datadog-e2e

      - name: Set run ID
        run: echo "E2E_RUN_ID=$(openssl rand -hex 4)" >> "$GITHUB_ENV"

      - name: Run e2e tests
        working-directory: e2e
        run: go test -count=1 -v -timeout 55m -json ./... | jq --unbuffered -jr 'select(.Action == "output") | .Output'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID_E2E }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_E2E }}
          AZURE_CONTAINER_APP_ENV: ${{ vars.AZURE_CONTAINER_APP_ENV_E2E }}
          DATADOG_API_KEY: ${{ steps.dd-sts.outputs.api_key }}
          DATADOG_APP_KEY: ${{ steps.dd-sts.outputs.app_key }}
          DD_SITE: ${{ vars.DD_SITE_E2E || 'datadoghq.com' }}

      - name: Ensure app deletion
        if: always() && env.E2E_RUN_ID != ''
        run: |
          name="one-e2e-tf-capp-${E2E_RUN_ID}"
          if az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$name" --only-show-errors >/dev/null 2>&1; then
            az containerapp delete --resource-group "$AZURE_RESOURCE_GROUP" --name "$name" --yes --no-wait --only-show-errors
          fi
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP_E2E }}
