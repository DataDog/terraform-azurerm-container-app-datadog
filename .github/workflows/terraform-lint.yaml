name: Terraform Lint Check

permissions:
  contents: read

on:
  pull_request:
    paths:
      - '**'

jobs:
  tflint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install TFLint
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/terraform-linters/tflint/releases/download/v0.65.0/tflint_linux_amd64.zip
          curl -fsSLO https://github.com/terraform-linters/tflint/releases/download/v0.65.0/checksums.txt
          sha256sum --ignore-missing -c checksums.txt
          unzip -q tflint_linux_amd64.zip
          sudo install -m 0755 tflint /usr/local/bin/tflint
          tflint --version

      - name: Run TFLint
        run: |
          tflint --recursive --config "$(pwd)/.tflint.hcl"
          echo All files passed the linter!
